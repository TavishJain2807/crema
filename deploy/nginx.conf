# /etc/nginx/sites-available/crema
# Replace coffee.example.com with your hostname and add TLS (certbot works well).

server {
    listen 80;
    server_name coffee.example.com;

    # Photo uploads are capped at 10 MB by the app; leave room for form overhead.
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
